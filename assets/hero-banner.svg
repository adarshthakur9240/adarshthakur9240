<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="55%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="316" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .rain text { fill:#0be08c; font-family:'Courier New', monospace; font-size:14px; opacity:0.16; }
    .col { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes fall {
      0%   { transform: translateY(-360px); }
      100% { transform: translateY(360px); }
    }
    .scan { animation: scanmove 3.4s linear infinite; }
    @keyframes scanmove { 0%{ transform:translateY(-6px);} 100%{ transform:translateY(320px);} }

    .name-main { fill:#eef9ff; font-family:'Courier New', monospace; font-weight:800; letter-spacing:6px; }
    .name-cyan { fill:#00f3ff; opacity:0.75; mix-blend-mode:screen; animation:glitchCyan 3.2s infinite; }
    .name-mag  { fill:#ff2e9f; opacity:0.55; mix-blend-mode:screen; animation:glitchMag 3.2s infinite; }
    @keyframes glitchCyan {
      0%,38%,100% { transform:translate(0,0); }
      39% { transform:translate(-4px,1px); }
      41% { transform:translate(3px,-1px); }
      43% { transform:translate(0,0); }
      70% { transform:translate(0,0); }
      71% { transform:translate(-2px,1px); }
      73% { transform:translate(0,0); }
    }
    @keyframes glitchMag {
      0%,37%,100% { transform:translate(0,0); }
      38% { transform:translate(4px,-1px); }
      40% { transform:translate(-3px,1px); }
      42% { transform:translate(0,0); }
      69% { transform:translate(0,0); }
      70% { transform:translate(2px,-1px); }
      72% { transform:translate(0,0); }
    }

    .subtitle { fill:#7cf3ff; font-family:'Courier New', monospace; font-size:22px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }

    .reveal { animation: typewriter 3.6s steps(42) 1 forwards; }
    @keyframes typewriter {
      0% { width:0; }
      100% { width:640px; }
    }

    .corner { stroke:#00f3ff; stroke-width:2; fill:none; opacity:0.9; }
    .corner-pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ opacity:0.4; } 50%{ opacity:1; } }

    .tag { fill:#4f5b6e; font-family:'Courier New', monospace; font-size:13px; letter-spacing:2px; }
  </style>

  <rect width="1200" height="320" rx="14" fill="url(#bgGrad)"/>

  <g clip-path="url(#frame)">
    <g class="rain">
      <text class="col" x="30"  y="0" style="animation-duration:5.2s; animation-delay:-1.1s;">01</text>
      <text class="col" x="30"  y="24" style="animation-duration:5.2s; animation-delay:-1.1s;">10</text>
      <text class="col" x="30"  y="48" style="animation-duration:5.2s; animation-delay:-1.1s;">1F</text>
      <text class="col" x="30"  y="72" style="animation-duration:5.2s; animation-delay:-1.1s;">0A</text>
      <text class="col" x="30"  y="96" style="animation-duration:5.2s; animation-delay:-1.1s;">E3</text>

      <text class="col" x="98"  y="0" style="animation-duration:6.1s; animation-delay:-3.0s;">RS</text>
      <text class="col" x="98"  y="24" style="animation-duration:6.1s; animation-delay:-3.0s;">01</text>
      <text class="col" x="98"  y="48" style="animation-duration:6.1s; animation-delay:-3.0s;">FF</text>
      <text class="col" x="98"  y="72" style="animation-duration:6.1s; animation-delay:-3.0s;">7C</text>

      <text class="col" x="166" y="0" style="animation-duration:4.4s; animation-delay:-0.6s;">10</text>
      <text class="col" x="166" y="24" style="animation-duration:4.4s; animation-delay:-0.6s;">AD</text>
      <text class="col" x="166" y="48" style="animation-duration:4.4s; animation-delay:-0.6s;">01</text>

      <text class="col" x="1170" y="0" style="animation-duration:5.6s; animation-delay:-2.2s;">9F</text>
      <text class="col" x="1170" y="24" style="animation-duration:5.6s; animation-delay:-2.2s;">00</text>
      <text class="col" x="1170" y="48" style="animation-duration:5.6s; animation-delay:-2.2s;">E1</text>

      <text class="col" x="1100" y="0" style="animation-duration:4.9s; animation-delay:-1.7s;">RUST</text>
      <text class="col" x="1100" y="24" style="animation-duration:4.9s; animation-delay:-1.7s;">01</text>
      <text class="col" x="1100" y="48" style="animation-duration:4.9s; animation-delay:-1.7s;">0F</text>

      <text class="col" x="1030" y="0" style="animation-duration:5.9s; animation-delay:-3.4s;">WASM</text>
      <text class="col" x="1030" y="24" style="animation-duration:5.9s; animation-delay:-3.4s;">10</text>

      <text class="col" x="230" y="0" style="animation-duration:5.3s; animation-delay:-2.6s;">GO</text>
      <text class="col" x="230" y="24" style="animation-duration:5.3s; animation-delay:-2.6s;">01</text>
    </g>

    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00f3ff" opacity="0.14"/>
  </g>

  <text x="600" y="150" text-anchor="middle" class="name-mag"  font-size="60">ADARSH SINGH</text>
  <text x="600" y="150" text-anchor="middle" class="name-cyan" font-size="60">ADARSH SINGH</text>
  <text x="600" y="150" text-anchor="middle" class="name-main" font-size="60">ADARSH SINGH</text>

  <text x="600" y="185" text-anchor="middle" class="tag">FULL-STACK &amp; EDGE-AI ARCHITECT · SYSTEMS ENGINEER</text>

  <g transform="translate(280,215)">
    <clipPath id="typeClip"><rect class="reveal" x="0" y="-20" height="30" width="0"/></clipPath>
    <text x="0" y="0" class="subtitle" clip-path="url(#typeClip)">&gt; building zero-latency systems that don't sleep_</text>
    <rect x="636" y="-18" width="10" height="24" fill="#7cf3ff" class="cursor"/>
  </g>

  <g class="corner-pulse">
    <path class="corner" d="M22,40 L22,22 L40,22"/>
    <path class="corner" d="M1178,40 L1178,22 L1160,22"/>
    <path class="corner" d="M22,280 L22,298 L40,298"/>
    <path class="corner" d="M1178,280 L1178,298 L1160,298"/>
  </g>

  <rect x="2" y="2" width="1196" height="316" rx="14" fill="none" stroke="#00f3ff" stroke-opacity="0.35" stroke-width="1.4"/>
  <rect width="1200" height="320" rx="14" fill="url(#edgeFade)"/>
</svg>
