<svg width="420" height="90" viewBox="0 0 420 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .box { fill:#0a0508; stroke:#ff2e9f; stroke-width:1.6; filter:url(#tGlow); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ stroke-opacity:0.6; } 50%{ stroke-opacity:1; } }
    .lbl { fill:#8fa3b8; font-family:'Courier New', monospace; font-size:12px; letter-spacing:2px; }
    .val { fill:#ff2e9f; font-family:'Courier New', monospace; font-size:22px; font-weight:800; filter:url(#tGlow); }
    .bar { fill:#ff2e9f; filter:url(#tGlow); }
    .stripe { animation: flow 1.2s linear infinite; }
    @keyframes flow { from{ transform:translateX(0);} to{ transform:translateX(-24px);} }
  </style>

  <rect x="1" y="1" width="418" height="88" rx="10" class="box"/>
  <text x="20" y="30" class="lbl">THREAT LEVEL</text>
  <text x="20" y="62" class="val">ELITE</text>

  <g clip-path="url(#tc)">
    <clipPath id="tc"><rect x="220" y="20" width="180" height="50" rx="6"/></clipPath>
    <g class="stripe">
      <rect x="220" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="244" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="268" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="292" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="316" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="340" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="364" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="388" y="20" width="6" height="50" class="bar" opacity="0.5"/>
      <rect x="412" y="20" width="6" height="50" class="bar" opacity="0.5"/>
    </g>
  </g>
</svg>
